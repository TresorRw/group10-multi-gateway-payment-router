name: Production Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Suite Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 1 Fast Unit Tests & Security Checks
        env:
          PAYMENT_GATEWAY_API_KEY: ${{ secrets.PAYMENT_GATEWAY_API_KEY || 'PROD_TEST_SECRET_KEY_123' }}
        run: pytest tests/test_unit.py -v

      - name: Stage 2 Physical Database Integration Tests
        env:
          PAYMENT_GATEWAY_API_KEY: ${{ secrets.PAYMENT_GATEWAY_API_KEY || 'PROD_TEST_SECRET_KEY_123' }}
        run: pytest tests/test_integration.py -v

      - name: Stage 3 Coverage Quality Gate
        env:
          PAYMENT_GATEWAY_API_KEY: ${{ secrets.PAYMENT_GATEWAY_API_KEY || 'PROD_TEST_SECRET_KEY_123' }}
        run: pytest --cov=payment_router --cov-report=term-missing --cov-fail-under=95 tests/
